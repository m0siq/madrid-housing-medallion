name: MadridHousingScanner – Scrape → Spark → Sync

on:
  schedule:
    # Run every 3 hours (minute 0 of hours 0, 3, 6, 9, 12, 15, 18, 21 UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages to scrape per source"
        default: "3"
        required: false
      sources:
        description: "Comma-separated sources (e.g. idealista,fotocasa)"
        default: "idealista,fotocasa"
        required: false

env:
  PYTHON_VERSION: "3.11"
  DATA_DIR: data
  BRONZE_DIR: data/bronze
  SILVER_DIR: data/silver
  GOLD_DIR: data/gold
  DUCKDB_PATH: data/madrid_housing.duckdb
  LOG_LEVEL: INFO
  LOG_FORMAT: json

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Bronze – Scrape raw listings from all sources
  # ─────────────────────────────────────────────────────────────────────────────
  bronze_scrape:
    name: 🥉 Bronze – Scrape Listings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Create data directories
        run: mkdir -p data/bronze data/silver data/gold

      - name: Run Bronze scraper
        run: |
          python - <<'EOF'
          import asyncio
          import sys
          from pipeline.extractors.factory import ExtractorFactory
          from pipeline.bronze.ingestor import BronzeIngestor
          from core.logging_config import configure_logging
          from core.config import settings

          configure_logging(level="INFO", fmt="json")
          sources_input = "${{ github.event.inputs.sources || 'idealista,fotocasa' }}"
          max_pages = int("${{ github.event.inputs.max_pages || '3' }}")
          sources = [s.strip() for s in sources_input.split(",")]
          ingestor = BronzeIngestor()

          async def scrape_all():
              for source in sources:
                  try:
                      extractor = ExtractorFactory.create(source)
                      records = await extractor.extract(
                          url=f"https://www.{source}.com/venta-viviendas/madrid-madrid/",
                          max_pages=max_pages,
                      )
                      if records:
                          ingestor.ingest(records, source=source)
                  except Exception as e:
                      print(f"ERROR scraping {source}: {e}", file=sys.stderr)

          asyncio.run(scrape_all())
          EOF

      - name: Upload Bronze artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bronze-data-${{ github.run_id }}
          path: data/bronze/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Silver – Clean and normalise with PySpark
  # ─────────────────────────────────────────────────────────────────────────────
  silver_clean:
    name: 🥈 Silver – PySpark Cleaner
    runs-on: ubuntu-latest
    needs: bronze_scrape
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Bronze data
        uses: actions/download-artifact@v4
        with:
          name: bronze-data-${{ github.run_id }}
          path: data/bronze/

      - name: Run Silver cleaner
        run: python -m pipeline.silver.cleaner

      - name: Upload Silver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silver-data-${{ github.run_id }}
          path: data/silver/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Gold – Compute Opportunity Index with PySpark
  # ─────────────────────────────────────────────────────────────────────────────
  gold_opportunity:
    name: 🥇 Gold – Opportunity Index
    runs-on: ubuntu-latest
    needs: silver_clean
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Silver data
        uses: actions/download-artifact@v4
        with:
          name: silver-data-${{ github.run_id }}
          path: data/silver/

      - name: Run Gold Opportunity Index job
        run: python -m pipeline.gold.opportunity_index

      - name: Upload Gold artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gold-data-${{ github.run_id }}
          path: data/gold/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: DuckDB Sync – Load Gold Parquet into DuckDB
  # ─────────────────────────────────────────────────────────────────────────────
  duckdb_sync:
    name: 🦆 DuckDB Sync
    runs-on: ubuntu-latest
    needs: gold_opportunity
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Gold data
        uses: actions/download-artifact@v4
        with:
          name: gold-data-${{ github.run_id }}
          path: data/gold/

      - name: Sync Gold → DuckDB
        run: |
          python - <<'EOF'
          from pipeline.storage.duckdb_repository import DuckDBRepository
          from core.logging_config import configure_logging
          configure_logging(level="INFO", fmt="json")
          repo = DuckDBRepository()
          count = repo.sync_gold_to_duckdb()
          print(f"Synced {count} rows into DuckDB.")
          EOF

      - name: Upload DuckDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ github.run_id }}
          path: data/madrid_housing.duckdb
          retention-days: 14
